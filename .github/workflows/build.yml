name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Auto Fix Folder Name
        run: |
          python3 << 'PY'
          import os, shutil
          for d in os.listdir('.'):
            if os.path.isdir(d) and d!='app' and os.path.exists(os.path.join(d,'src')):
              if os.path.exists('app'): shutil.rmtree('app')
              shutil.move(d,'app')
              break
          PY
      - name: Patch build.gradle
        run: |
          python3 << 'PY'
          p='app/build.gradle'
          s=open(p,encoding='utf-8',errors='ignore').read()
          if 'namespace' not in s:
            s=s.replace('android {',"android {\n namespace 'com.example.capsule'\n")
            open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Build Debug APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug --stacktrace
      - name: Find APK where is it
        run: find. -name "*.apk" -type f
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-app-apk
          path: |
            **/*.apk
