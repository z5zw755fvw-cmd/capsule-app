name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Auto Fix Folder Name
        run: |
          python3 << 'PY'
          import os, shutil
          for d in os.listdir('.'):
            if os.path.isdir(d) and d!='app' and os.path.exists(os.path.join(d,'src')):
              if os.path.exists('app'): shutil.rmtree('app')
              shutil.move(d,'app')
              break
          PY
      - name: Patch build.gradle
        run: |
          python3 << 'PY'
          import os
          p='app/build.gradle'
          s=open(p,encoding='utf-8',errors='ignore').read()
          print(s[:4000])
          if 'namespace' not in s:
            s=s.replace('android {',"android {\n namespace 'com.example.capsule'\n")
            open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee full.log
          echo "================ 错误总结 ================"
          grep -i -A 8 "FAILED\|error:\|Could not\|namespace" full.log | tail -n 200
        continue-on-error: true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-app-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
