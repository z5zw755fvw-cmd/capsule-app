name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Auto Fix Folder Name
        run: |
          python3 << 'PY'
          import os, shutil
          for d in os.listdir('.'):
            if os.path.isdir(d) and d!='app' and os.path.exists(os.path.join(d,'src')):
              if os.path.exists('app'): shutil.rmtree('app')
              shutil.move(d,'app')
              break
          PY

      - name: Patch gradle.properties
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Patch build.gradle - 保持Material3
        run: |
          python3 << 'PY'
          import re
          p='app/build.gradle'
          s=open(p,encoding='utf-8',errors='ignore').read()
          if 'namespace' not in s:
            s=s.replace('android {', "android {\n namespace 'com.example.capsule'\n")
          s=re.sub(r'compileSdk\s+\d+', 'compileSdk 34', s)
          s=re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 34', s)
          s=re.sub(r'targetSdk\s+\d+', 'targetSdk 34', s)
          if 'com.google.android.material' not in s:
            s=s.replace('dependencies {', "dependencies {\n implementation 'com.google.android.material:material:1.11.0'\n")
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Patch Manifest and Themes
        run: |
          python3 << 'PY'
          import glob, re
          for f in glob.glob('app/src/main/AndroidManifest.xml'):
            s=open(f,encoding='utf-8',errors='ignore').read()
            s=s.replace('@Theme.Material3', '@style/Theme.Material3')
            s=re.sub(r'"@Theme\.', '"@style/Theme.', s)
            s=s.replace('@style/@style/', '@style/')
            open(f,'w',encoding='utf-8').write(s)
          for f in glob.glob('app/src/main/res/**/themes.xml', recursive=True) + glob.glob('app/src/main/res/**/styles.xml', recursive=True):
            s=open(f,encoding='utf-8',errors='ignore').read()
            s=s.replace('@Theme.', '@style/Theme.')
            s=s.replace('@style/@style/', '@style/')
            open(f,'w',encoding='utf-8').write(s)
          PY

      - name: Build Debug APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -name "*.apk" -type f
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-app-apk
          path: "**/*.apk"
