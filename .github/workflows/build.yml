name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Auto Fix Folder Name
        run: |
          python3 << 'PY'
          import os, shutil
          for d in os.listdir('.'):
            if os.path.isdir(d) and d!='app' and os.path.exists(os.path.join(d,'src')):
              if os.path.exists('app'):
                shutil.rmtree('app')
              shutil.move(d,'app')
              print(f"Renamed {d} -> app")
              break
          print("List:", os.listdir('.'))
          PY

      - name: Patch gradle.properties - 修AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          cat gradle.properties

      - name: Patch build.gradle - 修namespace
        run: |
          python3 << 'PY'
          import os
          p='app/build.gradle'
          s=open(p,encoding='utf-8',errors='ignore').read()
          if 'namespace' not in s:
            s=s.replace('android {', "android {\n namespace 'com.example.capsule'\n")
            open(p,'w',encoding='utf-8').write(s)
            print("Patched namespace")
          PY

      - name: Build Debug APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug --stacktrace

      - name: Find APK
        run: find. -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-app-apk
          path: "**/*.apk"
